version: "3.8"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - FACILITATOR_PORT=3402
      - MULTIVERSX_NETWORK=${MULTIVERSX_NETWORK:-multiversx:D}
      - MULTIVERSX_API_URL=${MULTIVERSX_API_URL:-https://devnet-api.multiversx.com}
      - USDC_TOKEN_IDENTIFIER=${USDC_TOKEN_IDENTIFIER:-USDC-350c4e}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RELAYER_PEM_PATH=/app/wallets/relayer_shard0.pem
    volumes:
      - ./wallets:/app/wallets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - blockrun-net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SERVER_DOMAIN=${SERVER_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - blockrun-net

volumes:
  caddy_data:
  caddy_config:

networks:
  blockrun-net:
    driver: bridge
