apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiversx-claw-router
  labels:
    app: multiversx-claw-router
spec:
  replicas: 3
  selector:
    matchLabels:
      app: multiversx-claw-router
  template:
    metadata:
      labels:
        app: multiversx-claw-router
    spec:
      containers:
        - name: claw-router
          image: multiversx-claw-router:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: ROUTER_PORT
              value: "4000"
            - name: MULTIVERSX_NETWORK
              value: "multiversx:1"
            - name: MULTIVERSX_API_URL
              value: "https://api.multiversx.com"
            - name: USDC_TOKEN_IDENTIFIER
              value: "USDC-c76f1f"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: multiversx-claw-router-svc
spec:
  selector:
    app: multiversx-claw-router
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4000
  type: ClusterIP
